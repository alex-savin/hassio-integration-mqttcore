name: Tests

on:
  push:
  pull_request:
  schedule:
    - cron: "0 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    name: Ruff and mypy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements_test.txt
      - run: pip install -r requirements_test.txt
      - run: ruff format --check .
      - run: ruff check .
      - run: mypy

  pytest:
    name: pytest (Home Assistant ${{ matrix.channel }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        channel: [release, beta]
    continue-on-error: ${{ matrix.channel == 'beta' }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements_test.txt
      - name: Install the pinned release
        run: pip install -r requirements_test.txt
      - name: Move to the newest beta
        if: matrix.channel == 'beta'
        run: pip install --upgrade --pre pytest-homeassistant
      - run: pytest --cov --cov-report=term-missing
